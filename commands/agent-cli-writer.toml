description = "Design or review a command-line tool that AI agents operate: the command is the manual"
prompt = "Design or review the command-line tool I name for use by AI agents. Read skills/agent-cli-writer/SKILL.md in full first. Hold the tool to its twelve checks: it teaches at the point of use; a refusal says what, why and the exact next command; the tool carries its own rules; the right path is the easy path; one command answers where the caller stands and why; long work starts, returns a handle and tells the caller when it ends; default output fits one screen; text for a person and JSON lines for a program, with the exit code as the outcome; safe to repeat and safe at once; bounded, with a record; one name for one thing; secrets stay out. For a review, give one row per check with a verdict from a closed set (met, partly, not met, not checked) and the evidence: a command you ran or a line you read. Name the failure modes you found. Every count must come from a command you actually ran. Finish with the smallest changes that close the gaps, ordered by how often the fault occurs."
